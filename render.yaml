# Render Blueprint: Dashboard → New → Blueprint → выбрать этот репозиторий
databases:
  - name: fiesta-db
    databaseName: fiesta
    user: fiesta
    plan: free
    region: frankfurt

services:
  - type: web
    name: fiesta
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Миграции и перенос стартовых товаров выполняются при запуске (идемпотентно)
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fiesta-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
